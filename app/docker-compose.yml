services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
  api:
    build: ./api
    environment:
      DB_HOST: db
      DB_PASSWORD: secret
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["8081:80"]
    depends_on: [api]
