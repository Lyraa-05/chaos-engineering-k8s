# Burn CPU in every API pod for 3 minutes (limit is 500m -> CFS throttling).
# Run once without HPA and once with k8s/hpa.yaml applied.
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata: { name: api-stress-cpu, namespace: chaos-lab }
spec:
  mode: all
  selector:
    namespaces: [chaos-lab]
    labelSelectors: { app: api }
  containerNames: [api]
  stressors:
    cpu: { workers: 2, load: 90 }
  duration: "3m"
