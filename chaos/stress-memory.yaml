# Try to allocate 256MB inside an API pod whose limit is 128Mi -> expect OOM kill.
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata: { name: api-stress-memory, namespace: chaos-lab }
spec:
  mode: all
  selector:
    namespaces: [chaos-lab]
    labelSelectors: { app: api }
  containerNames: [api]
  stressors:
    memory: { workers: 1, size: "256MB" }
  duration: "2m"
